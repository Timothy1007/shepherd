<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <style>
    .room { fill:#f4efe6; stroke:#4a4038; stroke-width:2; }
    .opt { fill:#ece8f2; stroke:#6b5f80; stroke-width:2; stroke-dasharray:6 4; }
    .anom { fill:#e3e6ee; stroke:#6b5f80; stroke-width:1.5; stroke-dasharray:3 3; }
    .stair { fill:url(#hatch); stroke:#4a4038; stroke-width:1.5; }
    .yard { fill:#e6eee0; stroke:#7a8a6a; stroke-width:1.5; stroke-dasharray:5 3; }
    .t { font-size:13px; fill:#2b241f; }
    .s { font-size:10.5px; fill:#5b5048; }
    .h { font-size:16px; font-weight:700; fill:#2b241f; }
    .clue { fill:#c8792f; }
    .clueT { font-size:11px; fill:#fff; font-weight:700; }
    .echo { fill:#3d4f78; }
    .door { stroke:#f4efe6; stroke-width:5; }
    .street { font-size:11px; fill:#8a7a6a; }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#e9e1d3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b8a890" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1240" height="520" fill="#ffffff"/>

  <!-- 比例：1 m = 20 px；每層寬 6.5 m、深 15 m；街道在下方 -->
  <!-- ========== 地下室（可選） ========== -->
  <g transform="translate(30,60)">
    <text class="h" x="0" y="-20">地下室（可選）</text>
    <rect class="opt" x="0" y="80" width="130" height="140"/>
    <text class="t" x="10" y="140">店面倉庫</text>
    <text class="s" x="10" y="158">外婆的舊皮箱</text>
    <text class="s" x="10" y="172">鍋爐</text>
    <rect class="stair" x="100" y="80" width="30" height="40"/>
    <rect class="anom" x="0" y="0" width="130" height="78"/>
    <text class="s" x="8" y="30">異域才有的房間</text>
    <text class="s" x="8" y="46">（樓梯比應有的長）</text>
    <text class="street" x="0" y="320">↓ 街道</text>
  </g>

  <!-- ========== 一樓 ========== -->
  <g transform="translate(240,60)">
    <text class="h" x="0" y="-20">一樓</text>
    <rect class="yard" x="0" y="0" width="130" height="40"/>
    <text class="s" x="8" y="24">後院（可選）</text>
    <rect class="room" x="0" y="40" width="96" height="70"/>
    <text class="t" x="8" y="62">廚房</text>
    <text class="s" x="8" y="78">保鮮盒、高櫃</text>
    <circle class="clue" cx="80" cy="96" r="9"/><text class="clueT" x="76" y="100">2</text>
    <rect class="room" x="0" y="110" width="96" height="90"/>
    <text class="t" x="8" y="134">餐廳（終章）</text>
    <text class="s" x="8" y="150">碗筷、日曆</text>
    <circle class="clue" cx="80" cy="186" r="9"/><text class="clueT" x="76" y="190">6</text>
    <circle class="echo" cx="60" cy="186" r="7"/>
    <rect class="room" x="96" y="40" width="34" height="160"/>
    <rect class="stair" x="100" y="110" width="26" height="80"/>
    <text class="s" x="98" y="58">走廊</text>
    <text class="s" x="98" y="72">電話</text>
    <text class="s" x="98" y="100">地下室↓</text>
    <rect class="room" x="0" y="200" width="130" height="100"/>
    <text class="t" x="8" y="226">改衣店（店面）</text>
    <text class="s" x="8" y="244">衣架、人台、櫃台</text>
    <text class="s" x="8" y="258">電箱在櫃台後</text>
    <circle class="clue" cx="112" cy="282" r="9"/><text class="clueT" x="108" y="286">1</text>
    <circle class="echo" cx="92" cy="282" r="7"/>
    <line class="door" x1="96" y1="300" x2="120" y2="300"/>
    <line x1="10" y1="300" x2="80" y2="300" stroke="#7aa0c8" stroke-width="5"/>
    <text class="street" x="0" y="320">↓ 街道（大櫥窗、街燈）　前門 17</text>
  </g>

  <!-- ========== 二樓 ========== -->
  <g transform="translate(450,60)">
    <text class="h" x="0" y="-20">二樓</text>
    <rect class="room" x="0" y="40" width="96" height="50"/>
    <text class="t" x="8" y="62">浴室</text>
    <text class="s" x="8" y="78">鏡子</text>
    <rect class="room" x="0" y="90" width="96" height="100"/>
    <text class="t" x="8" y="112">母親的舊房間</text>
    <text class="s" x="8" y="128">縫紉機、便條</text>
    <circle class="clue" cx="80" cy="176" r="9"/><text class="clueT" x="76" y="180">4</text>
    <circle class="echo" cx="60" cy="176" r="7"/>
    <rect class="room" x="96" y="40" width="34" height="150"/>
    <rect class="stair" x="100" y="110" width="26" height="80"/>
    <text class="s" x="98" y="58">平台</text>
    <text class="s" x="98" y="72">閣樓梯↑</text>
    <text class="s" x="98" y="98">迴圈門</text>
    <rect class="room" x="0" y="190" width="130" height="110"/>
    <text class="t" x="8" y="222">客廳</text>
    <text class="s" x="8" y="240">壁爐、全家福</text>
    <text class="s" x="8" y="254">外婆的供桌</text>
    <circle class="clue" cx="112" cy="282" r="9"/><text class="clueT" x="108" y="286">3</text>
    <circle class="echo" cx="92" cy="282" r="7"/>
    <line x1="40" y1="190" x2="70" y2="190" stroke="#c8792f" stroke-width="4" stroke-dasharray="4 3"/>
    <text class="s" x="8" y="204" fill="#c8792f">↑ 內門（修好後的捷徑）</text>
    <line x1="10" y1="300" x2="120" y2="300" stroke="#7aa0c8" stroke-width="5"/>
    <text class="street" x="0" y="320">↓ 凸窗</text>
  </g>

  <!-- ========== 閣樓 ========== -->
  <g transform="translate(660,60)">
    <text class="h" x="0" y="-20">閣樓</text>
    <rect class="room" x="10" y="60" width="110" height="200"/>
    <rect x="10" y="60" width="18" height="200" fill="#e0d6c4" stroke="none"/>
    <rect x="102" y="60" width="18" height="200" fill="#e0d6c4" stroke="none"/>
    <text class="t" x="34" y="90">艾琳的房間</text>
    <text class="s" x="34" y="108">斜屋頂、天窗</text>
    <text class="s" x="34" y="122">研究牆、行李箱</text>
    <text class="s" x="34" y="136">她小時候的碗</text>
    <rect x="50" y="150" width="30" height="40" fill="#cfe0f2" stroke="#7aa0c8"/>
    <text class="s" x="52" y="205">天窗</text>
    <circle class="clue" cx="92" cy="240" r="9"/><text class="clueT" x="88" y="244">5</text>
    <circle class="echo" cx="72" cy="240" r="7"/>
    <rect class="stair" x="100" y="60" width="20" height="30"/>
    <rect class="opt" x="0" y="110" width="10" height="120"/>
    <text class="s" x="-2" y="290">← 屋簷下的爬行空間（可選）</text>
  </g>

  <!-- ========== 圖例與順序 ========== -->
  <g transform="translate(860,60)">
    <text class="h" x="0" y="-20">圖例</text>
    <circle class="clue" cx="10" cy="10" r="9"/><text class="clueT" x="6" y="14">1</text>
    <text class="t" x="28" y="14">必修房間（順序自由，1～5）</text>
    <circle class="echo" cx="10" cy="40" r="7"/>
    <text class="t" x="28" y="44">牆上的影子殘影</text>
    <rect class="stair" x="2" y="62" width="18" height="16"/>
    <text class="t" x="28" y="75">樓梯</text>
    <rect class="opt" x="2" y="92" width="18" height="16"/>
    <text class="t" x="28" y="105">可選區域</text>
    <rect class="anom" x="2" y="122" width="18" height="16"/>
    <text class="t" x="28" y="135">只在異域裡存在</text>
    <line x1="2" y1="160" x2="20" y2="160" stroke="#7aa0c8" stroke-width="5"/>
    <text class="t" x="28" y="165">大窗（月光／街燈）</text>

    <text class="h" x="0" y="215">流程</text>
    <text class="t" x="0" y="240">門外 → 1 店面（教聚光、電箱）</text>
    <text class="t" x="0" y="260">→ 一樓 2 廚房</text>
    <text class="t" x="0" y="280">→ 樓梯（聚光照著才踩得到）</text>
    <text class="t" x="0" y="300">→ 二樓 3 客廳、4 母親的舊房間</text>
    <text class="t" x="0" y="320">→ 閣樓 5 艾琳的房間（拿到她的碗）</text>
    <text class="t" x="0" y="340">→ 6 餐廳：擺上第二副碗筷</text>
    <text class="t" x="0" y="360">→ 那次爭吵的影子 → 崩塌 → 最終戰</text>
    <text class="s" x="0" y="390">比例：1 m = 20 px；真實尺寸 6.5 × 15 m，遊戲內再放大約 1.3 倍</text>
  </g>
</svg>
