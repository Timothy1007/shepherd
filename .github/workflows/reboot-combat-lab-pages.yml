name: Deploy Reboot Combat Lab
on:
  push:
    branches: [reboot]
    paths:
      - 'prototypes/combat-lab/**'
      - '.github/workflows/reboot-combat-lab-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/combat-lab
      - id: deployment
        uses: actions/deploy-pages@v4
