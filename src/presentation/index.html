<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>牧羊人：荒野之歌 — 爭局 Prototype 0.2</title>
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="interaction-fix.css"><link rel="stylesheet" href="hierarchy-polish.css"><link rel="stylesheet" href="tabletop-history.css"><link rel="stylesheet" href="camera-perspective.css"><link rel="stylesheet" href="round-resolution.css"><link rel="stylesheet" href="resource-deck.css"><link rel="stylesheet" href="effect-zone.css"><link rel="stylesheet" href="final-results.css"><link rel="stylesheet" href="foil-prototype.css"><link rel="stylesheet" href="ui-layout-tuning.css"><link rel="stylesheet" href="card-legality-visual.css"><link rel="stylesheet" href="ai-debug.css"><link rel="stylesheet" href="overlay-stack.css"><link rel="stylesheet" href="hand-stability.css"><link rel="stylesheet" href="death-round.css"><link rel="stylesheet" href="stronghold-card-template.css">
  <style>.qa-ai-hand{display:flex;justify-content:center;gap:2px;margin-top:7px;max-width:300px}.qa-ai-card{position:relative;width:38px;height:auto;aspect-ratio:152/214;padding:0;border:0;background:transparent;cursor:pointer;transition:.15s;filter:drop-shadow(0 3px 4px #0008);border-radius:5.4px;overflow:hidden;box-sizing:border-box;outline:0;box-shadow:none;flex:0 0 38px}.qa-ai-card:hover{transform:translateY(-10px) scale(1.8);z-index:100}.qa-ai-card:focus,.qa-ai-card:focus-visible{outline:0;box-shadow:none}.qa-ai-card img{display:block;width:100%;height:100%;object-fit:cover;border-radius:0}.qa-ai-card .runtime-tag-glyph--insight{z-index:2}.played-history-panel{position:relative;z-index:2;width:min(900px,92vw);max-height:86vh;overflow:auto;padding:28px;border:1px solid #d7bf8840;border-radius:24px;background:linear-gradient(145deg,#15211ff5,#0b1110f8);box-shadow:0 30px 90px #000c}.played-history-panel h2{margin:5px 0}.played-history-panel p{color:#b8b4a7}.played-history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:14px;margin-top:18px}.played-history-card{padding:8px;border:1px solid #d7bf8833;border-radius:12px;background:#ffffff08;cursor:pointer}.played-history-card:hover{border-color:#d9bd84;transform:translateY(-3px)}.played-history-card img{display:block;width:100%;height:145px;object-fit:contain}.played-history-card span{display:block;margin-top:5px;font-size:11px}.table-card{cursor:pointer}</style>
</head>
<body>
  <main class="dispute-shell">
    <img class="battle-background" src="assets/background.png" alt="" aria-hidden="true">
    <div class="world-layer" aria-hidden="true"><div class="horizon"></div><div class="ruins ruins-left"></div><div class="ruins ruins-right"></div><div class="ash"></div></div>
    <div id="layout-grid" class="layout-grid" aria-hidden="true"><div id="layout-grid-labels" class="layout-grid-labels"></div><div class="layout-zone-map"><i class="layout-zone zone-1">1</i><i class="layout-zone zone-2">2</i><i class="layout-zone zone-3">3</i><i class="layout-zone zone-4">4</i><i class="layout-zone zone-5">5</i><i class="layout-zone zone-6">6</i><i class="layout-zone zone-7">7</i><i class="layout-zone zone-8">8</i><i class="layout-zone zone-9">9</i></div></div><button id="layout-grid-toggle" class="layout-grid-toggle" type="button" aria-pressed="true">座標 32×18</button>
    <header class="hud-top"><p id="instruction" hidden>等待爭局開始</p><div class="top-left-hud"><div class="round-hud"><div id="venue-display">審判之環</div><a id="restart" href="./?restart=1">重新開始</a></div><div class="corruption-stack"><div class="corruption-hud" aria-live="polite"><span>崩壞值</span><strong id="corruption-value">0</strong></div><div id="round-display">第 1 輪</div></div><div id="judgment-bar" class="judgment-bar" aria-live="polite" hidden></div></div></header>
    <section id="status" class="status-strip" aria-label="爭局狀態" hidden></section><aside id="ai-debug-log" aria-label="戰況紀錄，短按查看完整內容" tabindex="0" role="button"></aside>
    <section class="arena" aria-label="爭局場域"><div id="seat-top" class="seat seat-top"></div><div id="seat-left" class="seat seat-left"></div><div id="seat-right" class="seat seat-right"></div><div id="seat-top-info" class="seat-top-info"></div><div class="ground-plane"><div class="board-surface" aria-hidden="true"></div></div><button id="resource-deck" class="resource-deck shared-card-pile" type="button" aria-label="牌庫，剩餘 0 張"><div class="deck-shadow" aria-hidden="true"></div><div class="deck-stack" aria-hidden="true"><span></span><span></span><span></span><span class="deck-top"></span></div><div class="deck-count"><span>牌庫</span><strong id="resource-deck-count">0</strong><em>張</em></div></button><button id="discard-pile" class="resource-deck shared-card-pile discard-pile" type="button" aria-label="隱藏棄牌堆，剩餘 0 張"><div class="deck-shadow" aria-hidden="true"></div><div class="deck-stack" aria-hidden="true"><span></span><span></span><span></span><span class="deck-top"></span></div><div class="deck-count"><span>棄牌</span><strong id="discard-pile-count">0</strong><em>張</em></div></button><div id="drop-zone" class="center-play"><div id="table-card" class="table-card"></div></div><div class="resource-status resource-status-current" aria-live="polite"><span>目前物資</span><strong id="current-resource-display">自由出牌</strong></div><div class="drag-instruction">拖曳或甩出卡牌至桌面中央</div><div id="round-result" class="round-result">尚未結算</div></section>
    <section class="human-zone"><div id="seat-human" class="human-meta"></div><div id="hand" class="hand" aria-label="你的手牌"></div><div id="selection-actions" class="selection-actions"></div><div id="actions" class="actions"></div></section>
    <div id="card-inspector" hidden aria-hidden="true"><div id="card-inspector-content"><div id="card-inspector-card"></div><aside id="card-inspector-text" aria-label="卡牌資訊"><div class="inspector-tabs" role="tablist"><button class="tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="pane-effect" data-target="pane-effect"></button><button class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="pane-type" data-target="pane-type"></button></div><div class="tab-content"><section class="tab-pane active" id="pane-effect" role="tabpanel"><p></p></section><section class="tab-pane" id="pane-type" role="tabpanel"><p></p></section></div></aside></div></div>
    <div id="detail-overlay" class="overlay" data-overlay-level="inspect" hidden><div class="overlay-backdrop" data-close="detail"></div><article class="detail-panel" role="dialog" aria-modal="true" aria-label="卡牌詳細資訊"><button class="overlay-close" data-close="detail" aria-label="關閉">×</button><div id="detail-content"></div></article></div>
    <div id="grace-overlay" class="overlay" data-overlay-level="decision" hidden><div class="overlay-backdrop"></div><article class="grace-panel" role="dialog" aria-modal="true" aria-labelledby="grace-title"><span class="eyebrow">恩典 · 化為物資</span><h2 id="grace-title">你要使這份恩典化為——</h2><p>選擇後，恩典將以該物資的卡面與規則真正進入爭局。</p><div id="grace-choices" class="grace-choices"></div><button id="grace-cancel" class="grace-cancel">放回手牌</button></article></div>
    <div id="debug-state" aria-live="polite" hidden></div><div id="boot-error" role="alert" hidden></div><div id="death-round-status" aria-live="polite" hidden></div><div id="toast" class="toast" aria-live="polite"></div>
  </main>
  <script src="interaction-guard.js"></script><script type="module" src="miracle-choice.js"></script><script type="module" src="target-choice.js"></script><script type="module" src="our-victory-choice.js"></script><script type="module" src="ark-choice.js"></script><script type="module" src="reaction-choice.js"></script><script type="module" src="qa-hand-normalizer.js"></script><script type="module" src="empty-tomb-reaction.js"></script><script type="module" src="ashes-stronghold.js"></script><script type="module" src="overcome-death-reaction.js"></script><script type="module" src="hope-insight.js"></script><script type="module" src="effect-zone.js"></script><script type="module" src="dawn-knock.js"></script><script type="module" src="rebuild-choice.js"></script><script type="module" src="browser-watchdog.js"></script><script type="module" src="final-results.js"></script><script type="module" src="app.js"></script><script type="module" src="tag-card-face-qa.js"></script><script type="module" src="stronghold-card-template.js"></script><script type="module" src="qa-inspector.js"></script><script src="detail-close-fix.js"></script><script type="module" src="tabletop-history.js"></script><script type="module" src="round-resolution.js"></script><script type="module" src="resource-deck.js"></script><script type="module" src="foil-prototype.js"></script><script type="module" src="lies-choice.js"></script><script type="module" src="audio-system.js"></script><script type="module" src="hand-stability.js"></script><script type="module" src="battle-log.js"></script><script type="module" src="reaction-five-qa.js"></script>
<script type="module" src="mission-reward-choice.js"></script><script type="module" src="aftermath-choice.js"></script><script type="module" src="narrow-choice.js"></script></body>
</html>
