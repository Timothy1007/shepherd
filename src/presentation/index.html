<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>牧羊人：荒野之歌 — 爭局 Prototype 0.2</title>
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="interaction-fix.css"><link rel="stylesheet" href="hierarchy-polish.css"><link rel="stylesheet" href="tabletop-history.css"><link rel="stylesheet" href="camera-perspective.css"><link rel="stylesheet" href="round-resolution.css"><link rel="stylesheet" href="resource-deck.css"><link rel="stylesheet" href="effect-zone.css"><link rel="stylesheet" href="final-results.css"><link rel="stylesheet" href="foil-prototype.css"><link rel="stylesheet" href="ui-layout-tuning.css"><link rel="stylesheet" href="card-legality-visual.css"><link rel="stylesheet" href="ai-debug.css"><link rel="stylesheet" href="overlay-stack.css">
  <style>.qa-ai-hand{display:flex;justify-content:center;gap:2px;margin-top:7px;max-width:300px}.qa-ai-card{width:38px;height:auto;aspect-ratio:152/214;padding:0;border:0;background:transparent;cursor:pointer;transition:.15s;filter:drop-shadow(0 3px 4px #0008);border-radius:5.4px;overflow:hidden;box-sizing:border-box;outline:0;box-shadow:none;flex:0 0 38px}.qa-ai-card:hover{transform:translateY(-10px) scale(1.8);z-index:100}.qa-ai-card:focus,.qa-ai-card:focus-visible{outline:0;box-shadow:none}.qa-ai-card img{display:block;width:100%;height:100%;object-fit:cover;border-radius:0}.played-history-panel{position:relative;z-index:2;width:min(900px,92vw);max-height:86vh;overflow:auto;padding:28px;border:1px solid #d7bf8840;border-radius:24px;background:linear-gradient(145deg,#15211ff5,#0b1110f8);box-shadow:0 30px 90px #000c}.played-history-panel h2{margin:5px 0}.played-history-panel p{color:#b8b4a7}.played-history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:14px;margin-top:18px}.played-history-card{padding:8px;border:1px solid #d7bf8833;border-radius:12px;background:#ffffff08;cursor:pointer}.played-history-card:hover{border-color:#d9bd84;transform:translateY(-3px)}.played-history-card img{display:block;width:100%;height:145px;object-fit:contain}.played-history-card span{display:block;margin-top:5px;font-size:11px}.table-card{cursor:pointer}</style>
</head>
<body>
  <main class="dispute-shell">
    <video class="battle-background" autoplay muted loop playsinline preload="auto" aria-hidden="true"><source src="assets/background.mp4" type="video/mp4"></video>
    <div class="world-layer" aria-hidden="true"><div class="horizon"></div><div class="ruins ruins-left"></div><div class="ruins ruins-right"></div><div class="ash"></div></div>
    <header class="hud-top"><div class="event-copy"><span class="eyebrow">荒野爭局 · PROTOTYPE 0.2</span><h1>牧羊人：荒野之歌</h1><p id="instruction">等待爭局開始</p></div><div class="round-hud"><div id="round-display">第 1 / 7 輪</div><a id="restart" href="./?restart=1">重新開始</a></div></header>
    <section id="status" class="status-strip" aria-label="爭局狀態"></section><aside id="ai-debug-log" aria-label="AI 行動除錯紀錄"></aside>
    <section class="arena" aria-label="爭局場域"><div id="seat-top" class="seat seat-top"></div><div id="seat-left" class="seat seat-left"></div><div id="seat-right" class="seat seat-right"></div><div class="ground-plane"><div class="board-surface" aria-hidden="true"></div><div id="resource-deck" class="resource-deck" aria-label="物資牌庫，剩餘 0 張"><div class="deck-shadow" aria-hidden="true"></div><div class="deck-stack" aria-hidden="true"><span></span><span></span><span></span><span class="deck-top"></span></div><div class="deck-count"><span>物資牌庫</span><strong id="resource-deck-count">0</strong></div></div><div id="drop-zone" class="center-play"><div id="table-card" class="table-card"><span>等待本輪第一張物資牌</span></div></div></div><div class="center-meta" aria-live="polite"><span class="center-label">當前物資</span><div id="apostle-display" class="apostle-display">使徒 · 尚無</div></div><div class="drag-instruction">拖曳或甩出卡牌至桌面中央</div><div id="round-result" class="round-result">尚未結算</div></section>
    <section class="human-zone"><div id="seat-human" class="human-meta"></div><div id="hand" class="hand" aria-label="你的手牌"></div><div id="selection-actions" class="selection-actions"></div><div id="actions" class="actions"></div></section>
    <div id="detail-overlay" class="overlay" data-overlay-level="inspect" hidden><div class="overlay-backdrop" data-close="detail"></div><article class="detail-panel" role="dialog" aria-modal="true" aria-label="卡牌詳細資訊"><button class="overlay-close" data-close="detail" aria-label="關閉">×</button><div id="detail-content"></div></article></div>
    <div id="grace-overlay" class="overlay" data-overlay-level="decision" hidden><div class="overlay-backdrop"></div><article class="grace-panel" role="dialog" aria-modal="true" aria-labelledby="grace-title"><span class="eyebrow">恩典 · 化為物資</span><h2 id="grace-title">你要使這份恩典化為——</h2><p>選擇後，恩典將以該物資的卡面與規則真正進入爭局。</p><div id="grace-choices" class="grace-choices"></div><button id="grace-cancel" class="grace-cancel">放回手牌</button></article></div>
    <div id="debug-state" aria-live="polite" style="position:fixed;left:8px;top:8px;z-index:20000;font:11px/1.35 monospace;color:#d8d1bf;background:#050807cc;padding:6px 8px;border-radius:6px;pointer-events:none"></div><div id="toast" class="toast" aria-live="polite"></div>
  </main>
  <script src="interaction-guard.js"></script><script type="module" src="miracle-choice.js"></script><script type="module" src="target-choice.js"></script><script type="module" src="ark-choice.js"></script><script type="module" src="reaction-choice.js"></script><script type="module" src="qa-hand-normalizer.js"></script><script type="module" src="empty-tomb-reaction.js"></script><script type="module" src="ashes-stronghold.js"></script><script type="module" src="overcome-death-reaction.js"></script><script type="module" src="effect-zone.js"></script><script type="module" src="browser-watchdog.js"></script><script type="module" src="final-results.js"></script><script type="module" src="app.js"></script><script type="module" src="qa-inspector.js"></script><script src="detail-close-fix.js"></script><script type="module" src="tabletop-history.js"></script><script type="module" src="round-resolution.js"></script><script type="module" src="resource-deck.js"></script><script type="module" src="foil-prototype.js"></script><script type="module" src="lies-choice.js"></script>
</body>
</html>
