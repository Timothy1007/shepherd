<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>牧羊人 Reboot｜玩法實驗室</title><style>body{font:16px system-ui;background:#151b20;color:#eee;margin:0;padding:20px}main{max-width:900px;margin:auto}button{cursor:pointer;background:#293841;color:white;border:1px solid #667;border-radius:9px;padding:12px;margin:4px}button:disabled{opacity:.35}button:hover:not(:disabled){background:#435a60}.panel{border:1px solid #52616a;border-radius:12px;padding:15px;margin:12px 0}#hand button{min-width:90px;height:110px}#queue button{background:#526046}#log{white-space:pre-wrap;max-height:190px;overflow:auto;font-size:14px}.stats{display:flex;gap:18px;flex-wrap:wrap}.hint{color:#afc4c8}h1{font-size:25px}</style><main><h1>牧羊人：荒野之歌｜玩法實驗室 v0.1</h1><p class="hint">純文字可玩戰鬥 Sandbox。採用 Reboot 的 30 張牌、7 手牌、3 AP、四種法則與三格敵人預知；敵人數值僅供測試。</p><div class="panel"><div class="stats"><b id="hp"></b><b id="enemy"></b><b id="ap"></b><b id="seed"></b><b id="deck"></b></div><p id="intents"></p></div><div class="panel"><h3>本次出牌（按順序結算）</h3><div id="queue"></div><p id="preview"></p><button id="commit">確認行動／敵人行動</button><button id="undo">撤銷最後一張</button><button id="harvest">本回合收割種子</button></div><div class="panel"><h3>手牌：點擊加入出牌序列</h3><div id="hand"></div></div><div class="panel"><button id="reset">重新開始（隨機牌序）</button><button id="fixed">固定牌序重玩</button><h3>戰況紀錄</h3><div id="log"></div></div></main><script>
let s,initialSeed=12345;const $=id=>document.getElementById(id);const names={sheep:"群羊",food:"糧食",money:"金錢",grace:"恩典"};let seedNum=initialSeed;function rng(){seedNum=(Math.imul(seedNum,1664525)+1013904223)>>>0;return seedNum/4294967296}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){if(!s.deck.length){s.deck=shuffle(s.discard.splice(0));s.logs.unshift("棄牌堆重新洗入牌庫")}if(s.deck.length&&s.hand.length<7)s.hand.push(s.deck.pop())}
function start(fixed=false){seedNum=fixed?initialSeed:(initialSeed=(Date.now()>>>0));let cards=[];for(let n=1;n<=9;n++)for(let t of ["sheep","food","money"])cards.push({t,n,id:t+n});for(let i=0;i<3;i++)cards.push({t:"grace",n:0,id:"g"+i});s={deck:shuffle(cards),discard:[],hand:[],queue:[],ap:3,hp:20,enemy:85,turn:0,seedAge:0,harvest:false,logs:["開始遭遇：敵人 HP 85（測試數值）"],over:false};for(let i=0;i<7;i++)draw();render()}
function intent(i){return i%3===2?"恢復 4 HP":"攻擊 "+(Math.floor(i/3)*2+(i%3)+1)+" 理智"}
function forecast(){return [0,1,2].map(j=>"第"+(s.turn+j+1)+"次："+intent(s.turn+j)).join("　｜　")}
function combos(q){let base=q.reduce((v,c)=>v+c.n,0),bonus=0,mult=1,tags=[];let has=t=>q.filter(c=>c.t===t).length>=3;let effects=[];if(has("sheep"))effects.push("sheep");if(has("food"))effects.push("food");if(has("money"))effects.push("money");if(q.some(c=>c.t==="grace")&&effects.length){let chosen=effects[Math.floor(rng()*effects.length)];effects.push(chosen);tags.push("恩賜："+names[chosen])}for(let t of effects){if(t==="sheep"){mult*=2;tags.push("成群 ×2")}if(t==="food"){tags.push("播種 +1 種子")}if(t==="money"){base+=q[0]?.n||0;tags.push("積累：複製首牌數值")}}if(s.harvest)bonus=s.seedAge===1?5:15;return {damage:(base+bonus)*mult,effects,tags,bonus}}
function render(){ $("hp").textContent="理智 "+s.hp+"/20";$("enemy").textContent="敵人 HP "+s.enemy;$("ap").textContent="AP "+s.ap+"/3";$("seed").textContent="種子："+(s.seedAge?("可收割 +"+(s.seedAge===1?5:15)):"無");$("deck").textContent="牌庫 "+s.deck.length+"／棄牌 "+s.discard.length;$("intents").textContent="敵人預知："+forecast();$("hand").innerHTML="";s.hand.forEach((c,i)=>{let b=document.createElement("button");b.textContent=names[c.t]+"\n"+(c.n||"★");b.style.whiteSpace="pre-line";b.disabled=s.ap<=0||s.over;b.onclick=()=>{s.queue.push(s.hand.splice(i,1)[0]);s.ap--;render()};$("hand").append(b)});$("queue").innerHTML="";s.queue.forEach(c=>{let b=document.createElement("button");b.textContent=names[c.t]+(c.n||"★");b.disabled=true;$("queue").append(b)});let count=t=>s.queue.filter(c=>c.t===t).length;let base=s.queue.reduce((v,c)=>v+c.n,0);$("preview").textContent="卡面合計 "+base+"；三連候選："+["sheep","food","money"].filter(t=>count(t)>=3).map(t=>names[t]).join("、")+"；恩典 "+count("grace")+" 張。";$("harvest").disabled=!s.seedAge||s.harvest||s.over;$("harvest").textContent=s.harvest?"已選擇收割":"本回合收割種子";$("undo").disabled=!s.queue.length||s.over;$("commit").disabled=s.over;$("log").textContent=s.logs.join("\n")}
$("undo").onclick=()=>{s.hand.push(s.queue.pop());s.ap++;render()};$("harvest").onclick=()=>{s.harvest=true;render()};$("commit").onclick=()=>{let c=combos(s.queue),d=c.damage;s.enemy=Math.max(0,s.enemy-d);s.logs.unshift("玩家造成 "+d+" 傷害；"+(c.tags.join("、")||"無法則"));if(s.harvest)s.seedAge=0;else if(s.seedAge)s.seedAge=Math.min(2,s.seedAge+1);if(c.effects.includes("food"))s.seedAge=1;s.discard.push(...s.queue);s.queue=[];s.harvest=false;if(s.enemy<=0){s.over=true;s.logs.unshift("勝利！");render();return}if(s.turn%3===2){s.enemy=Math.min(85,s.enemy+4);s.logs.unshift("敵人恢復 4 HP")}else{let d=Math.floor(s.turn/3)*2+(s.turn%3)+1;s.hp=Math.max(0,s.hp-d);s.logs.unshift("敵人攻擊，理智 -"+d)}s.turn++;if(s.hp<=0){s.over=true;s.logs.unshift("戰敗：理智歸零");render();return}s.ap=3;draw();render()};$("reset").onclick=()=>start(false);$("fixed").onclick=()=>start(true);start(true);
</script></html>
