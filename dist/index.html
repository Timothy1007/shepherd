<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>牧羊人：荒野之歌｜卡牌試閱</title><meta name="description" content="使用原始卡面查看手牌，透過半透明浮層閱讀完整效果。"><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><span class="brand-mark">✦</span><div><h1>牧羊人<span>荒野之歌</span></h1><p>卡牌與手牌試閱</p></div></div><span class="quiet">點選查看 · 點空白處關閉</span></header>
<main><section class="table game-board" aria-label="對局桌面示意"><div class="table-top"><span>桌面示意</span><span class="quiet">尚未開始對局</span></div><div class="opponent-cards" aria-hidden="true"><img src="assets/back.png"><img src="assets/back.png"><img src="assets/back.png"></div><div class="played-cards" aria-label="已出牌區示意"><img src="assets/sheep-original.png" alt="群羊1範例"><img src="assets/food-original.png" alt="糧食1範例"><span>已出牌區</span></div></section><section class="hand-section" aria-labelledby="hand-title"><div class="hand-heading"><h2 id="hand-title">你的手牌 <span>／版面示意</span></h2><span id="selection-status">點選一張卡牌</span></div><div class="hand" id="hand"></div><p class="hand-note">點選只會查看卡牌，不會直接出牌。祝福與審判也放入此列，方便比較版型。</p></section></main>
<footer><span>手牌與放大卡面皆使用你的原圖</span><span>此頁為介面預覽，尚未進行對局。</span></footer>
<dialog id="card-dialog" aria-labelledby="detail-name"><button class="close-dialog" type="button" aria-label="關閉卡牌詳情">×</button><div class="focus-layout"><div class="card-stage"><div class="stage-card" id="large-card"></div><span class="ratio-note">你的原始範例 · 815 : 1110</span></div><article class="details" aria-live="polite"><div class="eyebrow" id="detail-type"></div><h2 id="detail-name"></h2><p class="tags" id="detail-tags"></p><div class="rule-divider"></div><p class="section-label">完整效果</p><p class="effect" id="detail-effect"></p><p class="price" id="detail-price"></p><div class="detail-bottom"><span>展示原始範例卡面；右側文字依目前確認的規則。</span><button id="back-to-hand" type="button">回到手牌</button></div></article></div></section>
</dialog><script src="app.js"></script></body></html>
