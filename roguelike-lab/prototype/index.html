<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>牧羊人｜Roguelike 戰鬥實驗室</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif;background:#101010;color:#e6e6e6}
*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0 0 8px}.muted{color:#9a9a9a;font-size:13px}
section{border:1px solid #444;border-radius:8px;padding:12px;margin-top:12px;background:#181818}
.row{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none!important}
button{background:#2c2c2c;color:inherit;border:1px solid #666;border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}
button:hover:not(:disabled){background:#404040}button:focus-visible{outline:2px solid #fff}button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:#666;border-color:#ddd}.card{width:112px;min-height:92px;text-align:left}
.card small{display:block;color:#aaa}.stage{border-style:dashed;min-height:60px}
.hud{line-height:1.9;font-size:14px}.log{max-height:200px;overflow:auto;font-size:12px;line-height:1.8;color:#c4c4c4}
</style></head><body><main>
<h1>牧羊人 · 荒野之歌｜Roguelike 戰鬥實驗室</h1>
<div class="muted">一次行動 = 一個回合。點牌放入暫存區，按「打出」才結算。</div>
<section id="setup"><h2>遭遇</h2><div class="row" id="enc"></div><h2 style="margin-top:12px">開局祝福</h2><div class="row" id="bless"></div>
<p><button id="start">開始戰鬥</button></p></section>
<div id="game" class="hide">
<section><div class="hud" id="hud"></div></section>
<section><h2>秘笈 <span class="muted" id="lockHint"></span></h2><div class="row" id="manuals"></div></section>
<section class="stage"><h2>暫存區（點牌取消）</h2><div class="row" id="staged"></div><p class="muted" id="preview"></p></section>
<section><h2>手牌 <span class="muted" id="hc"></span></h2><div class="row" id="hand"></div>
<div class="row" style="margin-top:10px"><button id="commit">打出</button><button id="clear">清空暫存</button><button id="redraw">調度</button><button id="sstrike">盾轉攻（守望）</button><button id="restart">重新開始</button></div>
<p id="msg"></p></section>
<section id="revealBox" class="hide"><h2>啟示：選一張加入手牌（下次行動可用）</h2><div class="row" id="reveal"></div></section>
<section><h2>戰鬥紀錄</h2><div class="log" id="log"></div></section>
</div></main>
<script src="engine.js"></script>
<script>
"use strict";
const E=Engine,$=id=>document.getElementById(id);
let S=null,pickE="shadow",pickB="sanity",redrawMode=false;
const btn=(attr,val,txt,on,dis)=>`<button data-${attr}="${val}" class="${on?"on":""}" ${dis?"disabled":""}>${txt}</button>`;
const cardBtn=(attr,c,dis)=>{const d=E.DEF[c.key];return `<button class="card" data-${attr}="${c.id}" ${dis?"disabled":""}>${d.i} <b>${d.n}</b><small>${d.t==="m"?"魔法":"物資"}・${d.c} AP</small></button>`};
function setup(){
  $("enc").innerHTML=Object.entries(E.ENEMIES).map(([k,v])=>btn("enemy",k,v.n+" "+v.hp+" HP",k===pickE)).join("");
  $("bless").innerHTML=Object.entries(E.BLESSINGS).map(([k,v])=>btn("bless",k,v,k===pickB)).join("");
}
function render(){
  if(!S)return;
  const used=E.apUsed(S),t=E.tally(S),busy=S.done||S.reveals.length>0;
  $("hud").innerHTML=`<b>${E.ENEMIES[S.enemy].n}</b> 生命 ${S.enemyHp}/${S.enemyMax}｜流血 ${S.bleed}${S.enemy==="bull"?"｜力量 +"+S.enemyPower:""}｜下一次攻擊 ${E.plan(S).join(" + ")}<br>`
   +`理智 ${S.sanity}/${S.maxSanity}｜護盾 ${S.shield}｜播種 ${S.seed}｜牧養 ${S.herd}｜投資 ${S.investment}｜堅守 ${S.fort}｜爆擊 ${Math.round(S.crit*100)}%｜盾反 ${Math.round(S.reflect*100)}%（僅守望）<br>`
   +`行動 ${S.round}｜AP ${used}/${S.maxAp}｜抽牌 ${S.deck.length}｜棄牌 ${S.discard.length}`;
  $("manuals").innerHTML=Object.entries(E.MANUALS).map(([k,v])=>btn("manual",k,v,S.manual===k,S.locked||busy)).join("");
  $("lockHint").textContent=S.locked?"（本次行動已鎖定）":"";
  $("staged").innerHTML=S.staged.map(c=>cardBtn("unstage",c,busy)).join("")||'<span class="muted">尚未放入任何牌</span>';
  const tag=(n,s)=>s+" "+n+(n===3?"（三連）":"");
  $("preview").textContent="預覽張數："+[tag(t.sheep,"羊"),tag(t.food,"糧"),tag(t.money,"錢")].join("／")+"。三連以打出時的最終張數判定。";
  $("hc").textContent="("+S.hand.length+"/7)";
  $("hand").innerHTML=S.hand.map(c=>cardBtn("stage",c,busy||(!redrawMode&&used+E.DEF[c.key].c>S.maxAp))).join("");
  $("commit").disabled=busy;$("clear").disabled=busy||!S.staged.length;
  $("redraw").disabled=busy||!S.redraw;$("redraw").className=redrawMode?"on":"";$("redraw").textContent=redrawMode?"取消調度（點要換出的牌）":"調度（剩 "+S.redraw+" 次）";
  $("sstrike").disabled=busy||S.manual!=="guard"||S.shieldUsed||!S.shield;
  $("revealBox").classList.toggle("hide",!S.reveals.length);
  $("reveal").innerHTML=S.reveals.length?S.reveals[0].map(c=>cardBtn("reveal",c,false)).join(""):"";
  $("msg").textContent=S.done?(S.enemyHp===0?"戰鬥勝利！":"戰鬥失敗。"):"";
  $("log").innerHTML=S.logs.map(s=>"<div>"+s+"</div>").join("");
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.enemy){pickE=d.enemy;setup();return}
  if(d.bless){pickB=d.bless;setup();return}
  if(!S)return;
  if(d.manual)E.selectManual(S,d.manual);
  if(d.stage){const id=+d.stage;if(redrawMode){E.redraw(S,id);redrawMode=false}else E.stage(S,id)}
  if(d.unstage)E.unstage(S,+d.unstage);
  if(d.reveal)E.pick(S,+d.reveal);
  render();
});
$("start").onclick=()=>{S=E.newGame({enemy:pickE,blessing:pickB});$("setup").classList.add("hide");$("game").classList.remove("hide");render()};
$("restart").onclick=()=>{S=null;redrawMode=false;$("game").classList.add("hide");$("setup").classList.remove("hide")};
$("commit").onclick=()=>{E.commit(S);render()};
$("clear").onclick=()=>{E.clearStage(S);render()};
$("redraw").onclick=()=>{redrawMode=!redrawMode;render()};
$("sstrike").onclick=()=>{E.shieldStrike(S);render()};
setup();
</script></body></html>
